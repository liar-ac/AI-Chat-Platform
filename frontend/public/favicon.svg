<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="48" height="48" rx="12" fill="url(#g)"/>
  <!-- Antenna stem -->
  <rect x="22" y="4" width="4" height="6" rx="2" fill="#fff" opacity="0.9"/>
  <!-- Antenna tip -->
  <circle cx="24" cy="4" r="3" fill="#FDE68A"/>
  <!-- Head -->
  <rect x="10" y="10" width="28" height="20" rx="6" fill="#fff" opacity="0.95"/>
  <!-- Left eye -->
  <circle cx="18" cy="19" r="3.5" fill="#6C5CE7"/>
  <circle cx="19" cy="18.5" r="1.2" fill="#fff"/>
  <!-- Right eye -->
  <circle cx="30" cy="19" r="3.5" fill="#6C5CE7"/>
  <circle cx="31" cy="18.5" r="1.2" fill="#fff"/>
  <!-- Mouth -->
  <rect x="18" y="24" width="12" height="2.5" rx="1.25" fill="#6C5CE7" opacity="0.5"/>
</svg>
